<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Вован: Решала</title>
  <script src="https://telegram.org"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #0f1117; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    #scene { width: 100%; height: 48vh; background: linear-gradient(180deg, #161b29 0%, #242b3d 100%); display: block; border-bottom: 2px solid #30363d; }
    #hud { position: absolute; top: 10px; left: 12px; right: 12px; display: flex; justify-content: space-between; font-size: 13px; background: rgba(0,0,0,0.5); padding: 6px 10px; border-radius: 8px; }
    #chat { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .msg { padding: 8px 12px; border-radius: 12px; max-width: 85%; font-size: 14px; line-height: 1.35; }
    .bot { background: #21262d; align-self: flex-start; border: 1px solid #30363d; }
    .user { background: #1f6feb; align-self: flex-end; }
    #controls { display: flex; padding: 8px; gap: 6px; background: #161b22; border-top: 1px solid #30363d; }
    input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: #fff; outline: none; }
    button { padding: 10px 16px; border-radius: 8px; border: none; background: #238636; color: #fff; font-weight: bold; }
  </style>
</head>
<body>
  <div id="hud">
    <span>😎 Уважение: <b id="rep">50%</b></span>
    <span>⚡ Статус: <b id="mood">Спокоен</b></span>
  </div>
  <canvas id="scene"></canvas>
  <div id="chat">
    <div class="msg bot">Слышь, братуха, заходи. Чё принес или по какому вопросу?</div>
  </div>
  <div id="controls">
    <input id="inp" placeholder="Напиши ответ..." />
    <button onclick="send()">▶</button>
  </div>

  <script>
    if (window.Telegram && Telegram.WebApp) Telegram.WebApp.expand();
    const API_URL = "https://" + "oleksandr-dmytrovych-denisov--vova-ai-bot-game-chat.us-east.modal.run";
    const canvas = document.getElementById('scene');
    const ctx = canvas.getContext('2d');
    let t = 0, mood = 'calm', rep = 50;

    function draw() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight * 0.48;
      const cx = canvas.width / 2, ground = canvas.height - 25;
      t += 0.05;
      const breath = Math.sin(t) * 3;
      const wave = mood === 'angry' ? Math.sin(t * 4) * 18 : Math.sin(t * 1.5) * 6;

      ctx.fillStyle = '#11141c';
      ctx.fillRect(0, ground, canvas.width, 25);

      ctx.strokeStyle = mood === 'angry' ? '#ff5555' : '#58a6ff';
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';

      ctx.beginPath();
      ctx.moveTo(cx - 12, ground - 65 + breath); ctx.lineTo(cx - 20, ground);
      ctx.moveTo(cx + 12, ground - 65 + breath); ctx.lineTo(cx + 20, ground);
      ctx.stroke();

      ctx.fillStyle = '#2d333b';
      ctx.beginPath();
      ctx.roundRect(cx - 24, ground - 125 + breath, 48, 65, 12);
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(cx - 24, ground - 115 + breath); ctx.lineTo(cx - 48, ground - 75 + wave);
      ctx.moveTo(cx + 24, ground - 115 + breath); ctx.lineTo(cx + 48, ground - 75 - wave);
      ctx.stroke();

      ctx.fillStyle = '#f0c6a0';
      ctx.beginPath();
      ctx.arc(cx, ground - 150 + breath, 22, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#111';
      ctx.fillRect(cx - 9, ground - 154 + breath, 5, 5);
      ctx.fillRect(cx + 4, ground - 154 + breath, 5, 5);
      if (mood === 'angry') {
        ctx.strokeStyle = '#111'; ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(cx - 12, ground - 160 + breath); ctx.lineTo(cx - 3, ground - 156 + breath);
        ctx.moveTo(cx + 12, ground - 160 + breath); ctx.lineTo(cx + 3, ground - 156 + breath);
        ctx.stroke();
      }
      requestAnimationFrame(draw);
    }
    draw();

    async function send() {
      const inp = document.getElementById('inp');
      const txt = inp.value.trim();
      if (!txt) return;
      addMsg(txt, 'user');
      inp.value = '';
      const waitDiv = addMsg('⏳ Вован думает...', 'bot');
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: txt })
        });
        const data = await res.json();
        waitDiv.innerText = data.reply || 'Молчит...';
        const low = (data.reply || '').toLowerCase();
        if (low.includes('кастет') || low.includes('хер') || low.includes('слышь') || low.includes('!')) {
          mood = 'angry';
          rep = Math.max(0, rep - 5);
        } else {
          mood = 'calm';
          rep = Math.min(100, rep + 5);
        }
        document.getElementById('mood').innerText = mood === 'angry' ? 'На взводе' : 'Спокоен';
        document.getElementById('rep').innerText = rep + '%';
      } catch (e) {
        waitDiv.innerText = 'Связь с сервером оборвалась, попробуй еще раз.';
      }
    }

    function addMsg(text, cls) {
      const div = document.createElement('div');
      div.className = 'msg ' + cls;
      div.innerText = text;
      const chat = document.getElementById('chat');
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Саня: Решала</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1c1c21;
            --accent-orange: #ff5500;
            --accent-blue: #1e90ff;
            --text-main: #f4f4f6;
            --text-muted: #8e8e98;
            --border-color: #2c2c35;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        header {
            background: var(--card-bg);
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }
        .title-block h1 { font-size: 16px; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase; }
        .title-block span { font-size: 11px; color: var(--accent-orange); font-weight: 600; }
        .stats { display: flex; gap: 10px; font-size: 13px; font-weight: 700; }
        .stat-badge { background: #26262e; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--border-color); }
        .stat-money { color: #4ade80; }
        .stat-rep { color: #fbbf24; }
        
        #scene-container {
            position: relative;
            height: 52vh;
            min-height: 230px;
            background: radial-gradient(circle at 50% 35%, #2a2a35 0%, #121214 85%);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            border-bottom: 1px solid var(--border-color);
        }
        canvas { width: 100%; height: 100%; display: block; }
        
        .action-bar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            padding: 8px 12px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
        }
        .btn-action {
            padding: 10px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-action:active { transform: scale(0.96); }
        .btn-squat { background: #2c2c35; color: var(--text-main); border: 1px solid #3f3f4a; }
        .btn-squat.active { background: var(--accent-blue); color: #fff; border-color: var(--accent-blue); }
        .btn-over { background: linear-gradient(135deg, #ff5500, #cc3300); color: #fff; }
    </style>
</head>
<body>
    <header>
        <div class="title-block">
            <h1>Саня: Решала</h1>
            <span>Telegram Edition</span>
        </div>
        <div class="stats">
            <div class="stat-badge">Баланс: <span id="balance" class="stat-money">0</span> ₴</div>
            <div class="stat-badge">Авторитет: <span id="reputation" class="stat-rep">50</span></div>
            <div class="stat-badge">Энергия: <span id="energy" class="stat-money">100</span>%</div>
        </div>
    </header>

    <div id="scene-container">
        <canvas id="game-canvas"></canvas>
    </div>

    <div class="action-bar">
        <button id="btn-squat" class="btn-action btn-squat">На корты</button>
        <button id="btn-over" class="btn-action btn-over">Глотнуть OVER</button>
    </div>
        <div id="chat-container">
            <div id="messages"></div>
        </div>
        
        <form id="input-form">
            <input type="text" id="user-input" placeholder="Ответь Сане..." autocomplete="off">
            <button type="submit" id="send-btn">Отправить</button>
        </form>
    </main>

    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const messagesContainer = document.getElementById('messages');
        const inputForm = document.getElementById('input-form');
        const userInput = document.getElementById('user-input');

        let isSquatting = false;
        let mouthOpen = 0;
        let gesturePhase = 0;
        let energyLevel = 100;
        let reputation = 50;
        let balance = 0;

        function resizeCanvas() {
            canvas.width = document.getElementById('scene-container').clientWidth;
            canvas.height = document.getElementById('scene-container').clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function drawSanya() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const groundY = canvas.height - 40;
            const bodyYOffset = isSquatting ? 60 : 0;
            const centerX = canvas.width / 2;

            // Черные кроссовки
            ctx.fillStyle = '#050505';
            if (isSquatting) {
                ctx.beginPath();
                ctx.roundRect(centerX - 65, groundY - 12, 35, 12, 5);
                ctx.roundRect(centerX + 30, groundY - 12, 35, 12, 5);
                ctx.fill();
            } else {
                ctx.beginPath();
                ctx.roundRect(centerX - 42, groundY - 14, 38, 14, 5);
                ctx.roundRect(centerX + 4, groundY - 14, 38, 14, 5);
                ctx.fill();
            }

            // Ноги (черные спортивки)
            ctx.fillStyle = '#1a1a1a';
            if (isSquatting) {
                ctx.beginPath();
                ctx.ellipse(centerX - 40, groundY - 22, 15, 28, Math.PI/4, 0, Math.PI * 2);
                ctx.ellipse(centerX + 40, groundY - 22, 15, 28, -Math.PI/4, 0, Math.PI * 2);
                ctx.fill();
            } else {
                ctx.fillRect(centerX - 35, groundY - 142, 25, 128);
                ctx.fillRect(centerX + 10, groundY - 142, 25, 128);
            }

            // Торс (черная спортивная одежда)
            ctx.fillStyle = '#0a0a0a';
            ctx.beginPath();
            ctx.roundRect(centerX - 50, groundY - 220 + bodyYOffset, 100, 90, [20, 20, 10, 10]);
            ctx.fill();

            // Руки и жестикуляция
            ctx.fillStyle = '#141414';
            const handOffset = Math.sin(gesturePhase) * 15;
            // Левая рука (с банкой OVER)
            ctx.beginPath();
            ctx.roundRect(centerX - 70 - handOffset, groundY - 200 + bodyYOffset, 30, 80, 15);
            ctx.fill();
            
            // Оранжево-черная банка энергетика OVER со звездой на букве R
            const canX = centerX - 67 - handOffset;
            const canY = groundY - 172 + bodyYOffset;
            ctx.fillStyle = '#ff5500';
            ctx.beginPath();
            ctx.roundRect(canX, canY, 22, 42, 4);
            ctx.fill();
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(canX, canY + 13, 22, 16);
            ctx.fillStyle = '#ff5500';
            ctx.font = 'bold 9px sans-serif';
            ctx.fillText('OVER', canX + 1, canY + 11);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 10px sans-serif';
            ctx.fillText('R★', canX + 4, canY + 25);

            // Правая рука (активная жестикуляция)
            ctx.fillStyle = '#141414';
            ctx.beginPath();
            ctx.roundRect(centerX + 40 + handOffset, groundY - 210 + bodyYOffset - (mouthOpen*5), 25, 75, 15);
            ctx.fill();

            // Шея и синие наушники на шее
            ctx.fillStyle = '#d1d1d6';
            ctx.fillRect(centerX - 15, groundY - 240 + bodyYOffset, 30, 25);
            ctx.strokeStyle = '#1e90ff';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.arc(centerX, groundY - 228 + bodyYOffset, 36, 0.85 * Math.PI, 0.15 * Math.PI);
            ctx.stroke();

            // Голова
            ctx.fillStyle = '#ffdbac';
            ctx.beginPath();
            ctx.arc(centerX, groundY - 275 + bodyYOffset, 40, 0, Math.PI * 2);
            ctx.fill(); ctx.fillStyle = '#0a0a0a'; ctx.fillRect(centerX - 16, groundY - 280 + bodyYOffset, 6, 6); ctx.fillRect(centerX + 10, groundY - 280 + bodyYOffset, 6, 6);


            // Борода с легкой проседью
            ctx.fillStyle = '#3b3b40';
            ctx.beginPath();
            ctx.moveTo(centerX - 36, groundY - 275 + bodyYOffset);
            ctx.arc(centerX, groundY - 265 + bodyYOffset, 38, 0.15 * Math.PI, 0.85 * Math.PI);
            ctx.fill();
            ctx.fillStyle = '#9ea3ad';
            ctx.beginPath();
            ctx.arc(centerX - 10, groundY - 256 + bodyYOffset, 9, 0, Math.PI * 2);
            ctx.arc(centerX + 12, groundY - 254 + bodyYOffset, 7, 0, Math.PI * 2);
            ctx.fill();

            // Зубочистка в углу рта
            ctx.strokeStyle = '#fff8dc';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(centerX + 15, groundY - 270 + bodyYOffset);
            ctx.lineTo(centerX + 46, groundY - 260 + bodyYOffset - mouthOpen);
            ctx.stroke();

            // Рот (открывается при разговоре)
            ctx.fillStyle = '#4a0000';
            ctx.fillRect(centerX - 10, groundY - 258 + bodyYOffset, 20, 8 + mouthOpen * 6);

            // Черная бейсболка
            ctx.fillStyle = '#0a0a0a';
            ctx.beginPath();
            ctx.arc(centerX, groundY - 285 + bodyYOffset, 41, Math.PI, 0);
            ctx.fill();
            ctx.fillRect(centerX - 5, groundY - 315 + bodyYOffset, 60, 12);
        }
        function updateAnimation() {
            if (mouthOpen > 0) mouthOpen -= 0.1;
            if (mouthOpen < 0) mouthOpen = 0;
            gesturePhase += 0.1;
            drawSanya();
            requestAnimationFrame(updateAnimation);
        }
        updateAnimation();

        function startTalking() {
            mouthOpen = 2;
        }

        inputForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage('Вы', text, 'user-msg');
            userInput.value = '';
            startTalking();

            try {
                const response = await fetch('https://oleksandr-dmytrovych-denisov--vova-ai-bot-game-chat.us-east.modal.run', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });
                const data = await response.json();
                
                startTalking();
                appendMessage('Саня', data.reply, 'sanya-msg');
                if (data.reward) {
                    balance += data.reward;
                    document.getElementById('balance').innerText = balance;
                }
            } catch (error) {
                appendMessage('Саня', 'Слышь, сеть барахлит, повтори-ка.', 'sanya-msg');
            }
        });

        function appendMessage(sender, text, className) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.innerHTML = `<strong>${sender}:</strong> ${text}`;
            messagesContainer.appendChild(msgDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        document.getElementById('btn-squat').addEventListener('click', () => {
            isSquatting = !isSquatting;
            document.getElementById('btn-squat').classList.toggle('active');
            startTalking();
        });

        document.getElementById('btn-over').addEventListener('click', () => {
            if (energyLevel < 100) {
                energyLevel = Math.min(100, energyLevel + 25);
                document.getElementById('energy').innerText = energyLevel;
                startTalking();
                appendMessage('Саня', 'О, тема! Энергия на максимум.', 'sanya-msg');
            } else {
                appendMessage('Саня', 'Куда в меня лезет? Я и так бодряком.', 'sanya-msg');
            }
        });
    </script>
</body>
</html>
